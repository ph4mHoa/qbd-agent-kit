name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e .
      - run: python -X dev -W error -m unittest discover -s tests -v
      # The Activity Monitor add-on; its window tests run where wxPython has a wheel (Windows) and skip elsewhere.
      - run: python -m pip install wxPython==4.3.2
        if: runner.os == 'Windows'
      - run: python -X dev -W error -m unittest discover -s addons/activity-monitor/tests -v
        env:
          PYTHONPATH: addons/activity-monitor
      - run: qbd --version
      - run: qbd health-check --demo
