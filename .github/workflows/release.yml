name: Release

# Publishes the package to PyPI when a GitHub release is published, through PyPI's trusted publishing: no token is
# stored. PyPI must list this repository, this file and the "pypi" environment as the project's trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
